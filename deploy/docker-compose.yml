services:
  db:
    image: postgres:17-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: pixelforge
      POSTGRES_USER: pixelforge
      POSTGRES_PASSWORD: ${DB_PASSWORD:?set DB_PASSWORD}
    volumes:
      - db-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U pixelforge"]
      interval: 5s
      timeout: 3s
      retries: 10

  app:
    build:
      context: ..
      dockerfile: deploy/Dockerfile
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    environment: &app-env
      APP_NAME: PromptEdit Pixelforge
      APP_ENV: production
      APP_DEBUG: "false"
      APP_URL: ${APP_URL:?set APP_URL}
      APP_KEY: ${APP_KEY:?set APP_KEY}
      APP_TIMEZONE: UTC
      LOG_CHANNEL: stderr
      DB_CONNECTION: pgsql
      DB_HOST: db
      DB_PORT: "5432"
      DB_DATABASE: pixelforge
      DB_USERNAME: pixelforge
      DB_PASSWORD: ${DB_PASSWORD}
      SESSION_DRIVER: database
      CACHE_STORE: database
      QUEUE_CONNECTION: database
      PIXELFORGE_BASE_URL: https://pixelforge.promptedit.dev/v1
      PIXELFORGE_API_KEY: ${PIXELFORGE_API_KEY:?set the PRODUCTION key}
      PIXELFORGE_WEBHOOK_SECRET: ${PIXELFORGE_WEBHOOK_SECRET:?set the PRODUCTION whsec}
      PIXELFORGE_ADMIN_EMAILS: ${PIXELFORGE_ADMIN_EMAILS:-}
    volumes:
      - storage-cache:/var/www/html/storage/framework

  web:
    image: nginx:1.27-alpine
    restart: unless-stopped
    depends_on:
      - app
    ports:
      - "80:80"
    volumes:
      - ./nginx.conf:/etc/nginx/conf.d/default.conf:ro

  worker:
    build:
      context: ..
      dockerfile: deploy/Dockerfile
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    command: php artisan queue:work --sleep=1 --tries=1 --max-time=3600
    environment: *app-env

  scheduler:
    build:
      context: ..
      dockerfile: deploy/Dockerfile
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    command: php artisan schedule:work
    environment: *app-env

volumes:
  db-data:
  storage-cache:
